name: CI

# This checks THIS APP: its lint, its types, and its tests. Deploying is
# `deploy.yml`'s job — it has the box's credentials, a concurrency group so two
# deploys cannot race for the same release directory, and a check that the site
# still answers afterwards. A second deploy job here had none of those and
# failed on every push for want of a Hetzner token, while the real deploy
# beside it succeeded.
#
# It used to also compile the buddy binary and verify the framework's generated
# docs artifacts, because this file was inherited wholesale from the stacks
# repository — and in an app all three failed by construction. "Core tests (all
# packages)" looped `storage/framework/core/*/tests`, a path an installed app
# does not have, so the glob stayed literal and CI reported `Failing core
# packages: *` on every run. A pipeline that is always red tells you nothing
# about the change that just landed.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # After the install: the bunfig preload resolves @stacksjs/env, so
      # anything invoking `bun` before node_modules exists dies with
      # `preload not found`. Only bites a project resolving the framework from
      # npm rather than a vendored storage/framework/core, but the ordering is
      # wrong either way.
      - name: Check lockfile version
        run: bun .github/scripts/check-lockfile-version.ts

      - name: Check dependency state
        env:
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEPENDENCY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun .github/scripts/check-dependency-commits.ts

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@8826c8e3a511995aa0e70a6f0c8b4289f751fa96 # v0.10.50
        with:
          version: '0.10.50'
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test
