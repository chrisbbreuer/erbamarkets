name: Catalog

# Bring the shop's live inventory into the deployed database, by hand.
#
# The nightly import is NOT here — it belongs to `app/Scheduler.ts`, and since
# stacks 0.70.355 a deploy installs the systemd unit that runs it
# (`erbamarkets-main-scheduler.service`). This ran on a cron of its own while
# that was broken, and keeping it would have put two `menu:sync` runs on the
# same minute: both write the same rows of one SQLite file, and the loser
# leaves half a menu behind.
#
# What is left is the manual path — after a schema change, or when someone
# needs the menu current now rather than at 04:00. It runs on the box, because
# the database is a SQLite file there and nothing off the machine can reach it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do on the box
        type: choice
        default: inspect
        options:
          - inspect
          - sync
          - full

# One at a time. Two imports writing the same rows would race, and the loser
# would leave half a menu behind.
concurrency:
  group: catalog-erbamarkets
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trust the deploy target
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Where the release actually lives is not something to guess at: this is a
      # shared box, and erbamarkets is a tenant on it rather than its owner.
      # `inspect` reports the layout and changes nothing, so the paths below can
      # be confirmed before anything writes.
      - name: Find the release
        id: find
        run: |
          ssh -o StrictHostKeyChecking=yes root@${{ secrets.DEPLOY_HOST }} '
            set -e
            echo "--- candidate release directories ---"
            ls -d /var/www/*erbamarkets* /opt/*erbamarkets* /srv/*erbamarkets* 2>/dev/null || true
            find /var/www /opt /srv -maxdepth 3 -name "buddy" -type f 2>/dev/null | head -10
            echo "--- systemd units ---"
            systemctl list-units --all --no-legend --plain 2>/dev/null | grep -i erbamarkets | head -10 || true
            echo "--- unit working directories ---"
            for u in $(systemctl list-units --all --no-legend --plain 2>/dev/null | awk "{print \$1}" | grep -i "^erbamarkets.*\.service$" | head -5); do
              echo "$u -> $(systemctl show -p WorkingDirectory --value "$u" 2>/dev/null) [$(systemctl is-active "$u" 2>/dev/null)]"
            done
            echo "--- inside the release dirs ---"
            for d in /var/www/erbamarkets-main /var/www/erbamarkets-api; do
              echo "== $d"
              ls -la "$d" 2>/dev/null | head -14
            done
            echo "--- current release ---"
            readlink -f /var/www/erbamarkets-main/current
            echo "--- shared (what survives a release) ---"
            find /var/www/erbamarkets-main/shared /var/www/erbamarkets-api/shared -maxdepth 3 2>/dev/null | head -20
            echo "--- the database ---"
            find /var/www/erbamarkets-main /var/www/erbamarkets-api -name "*.sqlite" -o -name "*.db" 2>/dev/null | head -10
            echo "--- how the app is configured to reach it ---"
            grep -hE "^DB_CONNECTION|^DB_DATABASE|^DB_HOST" /var/www/erbamarkets-main/current/.env 2>/dev/null || echo "(no .env at current)"
            echo "--- bun ---"
            ls -l /root/.bun/bin/bun 2>/dev/null || command -v bun || echo "no bun on PATH"
          '

      - name: Bring the catalog up to date
        if: inputs.mode == 'sync' || inputs.mode == 'full'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # The mode travels as an argument, not as a variable the remote shell
          # is expected to already have. Referencing one that only exists on the
          # runner is what `set -u` catches on the far side, as an unbound
          # variable rather than as the wrong branch — which is the better
          # failure, but a failure all the same.
          #
          # Quoted heredoc, so the runner interpolates nothing: the script that
          # arrives is the script written here.
          ssh -o StrictHostKeyChecking=yes "root@${{ secrets.DEPLOY_HOST }}" bash -s -- "$MODE" <<'REMOTE'
          set -euo pipefail
          mode="${1:-sync}"

          cd /var/www/erbamarkets-main/current
          export PATH="/root/.bun/bin:$PATH"

          # Which release this is actually running. `current` follows the last
          # deploy, so a catalog run started moments after a push executes the
          # release *before* it — which is how a command added in that push came
          # back "not found" here while working perfectly on a laptop.
          echo "release: $(readlink -f /var/www/erbamarkets-main/current)"

          # Fail on a release that does not have the command yet, rather than
          # part-way through with the schema already migrated.
          if ! ./buddy menu:sync --help >/dev/null 2>&1; then
            echo "this release has no menu:sync — wait for the deploy to finish, then re-run" >&2
            exit 1
          fi

          # `full` also brings the schema up to date and seeds the rows an
          # operator owns afterwards — the reason to reach for this rather than
          # wait for 04:00. `sync` is the menu alone: stock and prices move
          # daily, the shop's own settings do not.
          if [ "$mode" = 'full' ]; then
            ./buddy migrate
            ./buddy seed:catalog
          fi

          ./buddy menu:sync
          ./buddy menu:index
          REMOTE

      # A sync that imported nothing is a failure that looks like a success, so
      # the count is checked rather than the exit code.
      - name: Check the menu is really there
        if: inputs.mode == 'sync' || inputs.mode == 'full'
        run: |
          cards=$(curl -s -m 60 https://erba.stacksjs.com/menu | grep -oc 'class="card"' || echo 0)
          echo "products on the live menu: ${cards}"
          if [ "$cards" -lt 100 ]; then
            echo "::error::the live menu shows ${cards} products; the import did not land"
            exit 1
          fi
